name: Fix gradlew exec bit (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Bit exécutable + auto-nettoyage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x gradlew
          git rm -q .github/workflows/fix-gradlew-exec.yml
          git commit -m "gradlew : bit exécutable (corrige la soumission automatique de dépendances)"
          git push
