name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (tag, ex : v1.1) — vide = v1.0.<date>"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version }}"
          case "$GITHUB_REF_NAME" in v*) TAG="$GITHUB_REF_NAME" ;; esac
          if [ -z "$TAG" ]; then TAG="v1.0.$(date +%Y%m%d%H%M)"; fi
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "Calculator $TAG" \
            --generate-notes \
            2>/dev/null || gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
