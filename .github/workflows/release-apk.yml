name: Release APK & Archives

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (tag, ex : v1.1) — vide = v1.0.<date>"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare build artifacts and archives
        run: |
          # Détermination de la version/tag
          TAG="${{ inputs.version }}"
          case "$GITHUB_REF_NAME" in v*) TAG="$GITHUB_REF_NAME" ;; esac
          if [ -z "$TAG" ]; then TAG="v1.0.$(date +%Y%m%d%H%M)"; fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          # Noms dynamiques basés sur le tag
          APK_NAME="Calculator-$TAG.apk"
          ZIP_NAME="Calculator-$TAG.zip"
          TAR_NAME="Calculator-$TAG.tar.gz"

          # Copie et renommage de l'APK
          cp app/build/outputs/apk/debug/app-debug.apk "./$APK_NAME"

          # Compression des archives
          zip -j "$ZIP_NAME" "./$APK_NAME"
          tar -czvf "$TAR_NAME" "$APK_NAME"

      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: calculator-build-${{ env.RELEASE_TAG }}
          path: |
            Calculator-*.apk
            Calculator-*.zip
            Calculator-*.tar.gz

      - name: Publish files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          FILES="Calculator-$TAG.apk Calculator-$TAG.zip Calculator-$TAG.tar.gz"

          # Vérification de l'existence de la release avant envoi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "Calculator $TAG" \
              --generate-notes
          fi
